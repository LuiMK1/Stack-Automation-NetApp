    - name: Create the cluster management interface
      netapp.ontap.na_ontap_interface:
        state: present
        vserver: "{{ cluster_name }}"
        interface_name: cluster_mgmt
        address: "{{ ontap_hostname }}"
        netmask: "{{ cluster_mgmt_netmask }}"
        home_port: e0M
        service_policy: default-management
        hostname: "{{ node1_ip }}"
        username: admin
        password: "{{ontap_password}}"
        use_rest: always
        https: true
        validate_certs: false
      when: not (cluster_exists | bool)

    - name: Create the default route for cluster management
      netapp.ontap.na_ontap_net_routes:
        state: present
        vserver: "{{ cluster_name }}"
        destination: 0.0.0.0/0
        gateway: "{{ cluster_mgmt_gateway }}"
        hostname: "{{ node1_ip }}"
        username: admin
        password: "{{ontap_password}}"
        use_rest: always
        https: true
        validate_certs: false
      when: not (cluster_exists | bool)

    - name: Wait for the cluster to answer at the management IP
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        gather_subset:
          - cluster
        https: true
        validate_certs: false
      register: cluster_ready
      until: cluster_ready is succeeded
      retries: 12
      delay: 15
      when: not (cluster_exists | bool)

    - name: Discover nodes available to join
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        gather_subset:
          - cluster/nodes
        fields:
          - membership
          - cluster_interfaces
        https: true
        validate_certs: false
      register: discovered_nodes
      when:
        - not (cluster_exists | bool)
        - cluster_node_plan | default([]) | length > 1

    - name: Print discovered_nodes for debugging
      ansible.builtin.debug:
        var: discovered_nodes
      when:
        - not (cluster_exists | bool)
        - cluster_node_plan | default([]) | length > 1

    - name: Join available nodes to the cluster
      netapp.ontap.na_ontap_cluster:
        state: present
        cluster_ip_address: "{{ item.cluster_interfaces[0].ip.address }}"
        use_rest: always
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      loop: >-
        {{
          (discovered_nodes.ontap_info['cluster/nodes'] | default({}, true)).records | default([])
          | selectattr('membership', 'equalto', 'available') | list
        }}
      loop_control:
        label: "{{ (item.cluster_interfaces | default([{}], true) | first).ip.address | default('unknown') }}"
      when:
        - not (cluster_exists | bool)
        - cluster_node_plan | default([]) | length > 1

    - name: Verify the expected number of nodes joined the cluster
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        gather_subset:
          - cluster/nodes
        fields:
          - membership
        https: true
        validate_certs: false
      register: final_nodes
      when:
        - not (cluster_exists | bool)
        - cluster_node_plan | default([]) | length > 0

    - name: Fail if not all expected nodes joined the cluster
      ansible.builtin.assert:
        that:
          - ((final_nodes.ontap_info['cluster/nodes'] | default({}, true)).records | default([]) | selectattr('membership', 'equalto', 'member') | list | length) == cluster_node_plan | default([]) | length
        fail_msg: >-
          Expected {{ cluster_node_plan | default([]) | length }} node(s) in the cluster, found
          {{ (final_nodes.ontap_info['cluster/nodes'] | default({}, true)).records | default([]) | selectattr('membership', 'equalto', 'member') | list | length }}.
          Records: {{ (final_nodes.ontap_info['cluster/nodes'] | default({}, true)).records | default([]) }}
        success_msg: >-
          All {{ cluster_node_plan | default([]) | length }} node(s) are members of the cluster.
      when:
        - not (cluster_exists | bool)
        - cluster_node_plan | default([]) | length > 0
