---
- name: Security Hardening Tasks
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    user_account_rows: >-
      {{
        (user_accounts | from_json)
        if user_accounts is string
        else user_accounts
      }}
    mav_rule_rows: >-
      {{
        (mav_rules | from_json)
        if mav_rules is string
        else mav_rules
      }}

    ems_destination_rows: >-
      {{
        [] if (ems_destination_system_defined_input_filter | default('[]') | string | trim) in ['', '[]']
        else (
          ems_destination_system_defined_input_filter | from_json
          if ems_destination_system_defined_input_filter is string
          else ems_destination_system_defined_input_filter
        )
      }}
    raw_event_filters: "{{ system_defined_event_filters | default('[]') }}"
    system_defined_event_filter_list: >-
      {{
        [] if (raw_event_filters | string | trim) in ['', '[]']
        else (
          raw_event_filters | from_json
          if raw_event_filters is string and (raw_event_filters | string | trim) is match('^\\[')
          else (
            raw_event_filters if raw_event_filters is not string
            else raw_event_filters.split(',')
          )
        )
      }}
    user_defined_event_filter_rows: >-
      {{
        [] if (user_defined_event_filter | default('[]') | string | trim) in ['', '[]']
        else (
          user_defined_event_filter | from_json
          if user_defined_event_filter is string
          else user_defined_event_filter
        )
      }}

    user_defined_event_filter_names: >-
      {{
        user_defined_event_filter_rows
        | map(attribute='Name') | map('trim') | reject('equalto', '') | unique | list
      }}
    ems_destination_user_defined_rows: >-
      {{
        [] if (ems_destination_user_defined_filter | default('[]') | string | trim) in ['', '[]']
        else (
          ems_destination_user_defined_filter | from_json
          if ems_destination_user_defined_filter is string
          else ems_destination_user_defined_filter
        )
      }}

