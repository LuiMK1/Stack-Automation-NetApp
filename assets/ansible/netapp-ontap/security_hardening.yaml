---
- name: Security Hardening Tasks
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    user_account_rows: >-
      {{
        (user_accounts | from_json)
        if user_accounts is string
        else user_accounts
      }}
    mav_rule_rows: >-
      {{
        (mav_rules | from_json)
        if mav_rules is string
        else mav_rules
      }}

  tasks:

     # Configure event notification and logging for the cluster
    - name: Configure event notification for the cluster
      netapp.ontap.na_ontap_rest_cli:
        command: 'event/config'
        verb: 'PATCH'
        body: {'mail-from': '{{ mail_from }}', 'mail-server': '{{ mail_server }}', 'proxy-url': '{{ proxy_url | default(omit) }}', 'proxy-user': '{{ proxy_user | default(omit) }}'}
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        validate_certs: false

    - name: Normalize user account rows
      ansible.builtin.set_fact:
        user_account_plan: "{{ user_account_plan | default([]) + [normalized_row] }}"
      vars:
        normalized_row:
          username: "{{ item.username | default(item['Username'], true) | default('', true) | trim }}"
          password: "{{ item.password | default(item['Password'], true) | default('', true) | trim }}"
          email: "{{ item.email | default(item['Email'], true) | default('', true) | trim }}"
      loop: "{{ user_account_rows }}"
      loop_control:
        label: "{{ item.username | default(item['Username'], true) | default('unnamed row', true) }}"

    - name: Select requested user accounts
      ansible.builtin.set_fact:
        user_account_requests: "{{ user_account_requests | default([]) + [item] }}"
      loop: "{{ user_account_plan | default([]) }}"
      when: item.username | length > 0 and item.password | length > 0
      loop_control:
        label: "{{ item.username }}"

    - name: Validate usernames and email IDs are unique
      ansible.builtin.assert:
        that:
          - requested_usernames | length == requested_usernames | unique | length
          - requested_emails | length == requested_emails | unique | length
        fail_msg: >-
          Duplicate entries found in user accounts.
          Duplicate usernames: {% for v in requested_usernames | unique if requested_usernames.count(v) > 1 %}{{ v }} {% endfor %}
          Duplicate emails: {% for v in requested_emails | unique if requested_emails.count(v) > 1 %}{{ v }} {% endfor %}
        quiet: true
      vars:
        requested_usernames: "{{ user_account_requests | default([]) | map(attribute='username') | map('lower') | list }}"
        requested_emails: "{{ user_account_requests | default([]) | map(attribute='email') | map('lower') | select('truthy') | list }}"

    # Create new administrator accounts to receive multi-admin verification (MAV)
    - name: Create new users to receive multi-admin verification
      netapp.ontap.na_ontap_user:
        state: present
        name: "{{ item.username }}"
        set_password: "{{ item.password }}"
        role_name: admin
        applications: ssh,http,ontapi
        authentication_method: password
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      with_items:
        - "{{ user_account_requests | default([]) }}"

    - name: Create a MAV approval group
      netapp.ontap.na_ontap_mav_approval_group:
        state: present
        name: "{{ approval_group_name }}"
        email: "{{ user_account_requests | default([]) | map(attribute='email') | list }}"
        approvers: "{{ user_account_requests | default([]) | map(attribute='username') | list }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
      when: user_account_requests | default([]) | length > 0
    
    - name: Normalize MAV rule rows
      ansible.builtin.set_fact:
        mav_rule_plan: "{{ mav_rule_plan | default([]) + [normalized_row] }}"
      vars:
        normalized_row:
          operation: "{{ item.operation | default(item['Operation'], true) | default('', true) | trim }}"
          query: "{{ item.query | default(item['Query'], true) | default('', true) | trim }}"
      loop: "{{ mav_rule_rows }}"
      loop_control:
        label: "{{ item.operation | default(item['Operation'], true) | default('unnamed row', true) }}"

    - name: Select requested MAV rules
      ansible.builtin.set_fact:
        mav_rule_requests: "{{ mav_rule_requests | default([]) + [item] }}"
      loop: "{{ mav_rule_plan | default([]) }}"
      when: item.operation | length > 0
      loop_control:
        label: "{{ item.operation }}"

    - name: Create MAV rules
      netapp.ontap.na_ontap_mav_rule:
        state: present
        auto_request_create: true
        required_approvers: "{{ required_approvers | int }}"
        approval_groups: ["{{ approval_group_name }}"]
        operation: "{{ item.operation }}"
        query: "{{ item.query if item.query | length > 0 else omit }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
      with_items:
        - "{{ mav_rule_requests | default([]) }}"
      loop_control:
        label: "{{ item.operation }}"
      when: user_account_requests | default([]) | length > 0
  
    - name: Enable multi-admin approval
      netapp.ontap.na_ontap_mav_config:
        state: present
        enabled: true
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
      when: user_account_requests | default([]) | length > 0

