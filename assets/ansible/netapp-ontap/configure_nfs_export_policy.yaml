# Adds one rule to the SVM default export policy for the NFS client subnet,
# then assigns that policy to the SVM root volume.
# The policy name is default. The protocol is nfs. The rule index is 1.
# Read-only, read-write, and superuser security are sys, and suid is allowed.
# Those values are fixed.
# The root volume already exists. Its name is read from the cluster.
# SVM AA02-OCP-SVM uses root volume AA02_OCP_SVM_root.
# Leave nfs_client_match blank to skip this task.
# This task runs after the SVM task. nfs must be one of the SVM protocols.
- name: Configure the NFS export policy
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    svm_name_normalized: "{{ svm_name | default('') | string | trim }}"
    nfs_client_match_normalized: "{{ nfs_client_match | default('') | string | trim }}"
    raw_protocols: "{{ allowed_protocols | default('[]') }}"
    decoded_protocols: >-
      {{
        [] if (raw_protocols | string | trim) in ['', '[]']
        else (
          raw_protocols | from_json
          if raw_protocols is string and (raw_protocols | string | trim) is match('^\\[')
          else (
            raw_protocols if raw_protocols is not string
            else raw_protocols.split(',')
          )
        )
      }}
    protocol_list: >-
      {{
        decoded_protocols
        | map('string')
        | map('trim')
        | map('lower')
        | reject('equalto', '')
        | unique
        | list
      }}
    ipv4_cidr_pattern: '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])$'

  tasks:

    - name: Validate the SVM name
      ansible.builtin.assert:
        that:
          - svm_name_normalized is match('^[A-Za-z_][A-Za-z0-9_.-]{0,40}$')
        fail_msg: >-
          SVM name must start with a letter or underscore, contain only
          letters, numbers, underscores, hyphens, and periods, and be at most
          41 characters.

    - name: Validate the NFS client match
      ansible.builtin.assert:
        that:
          - nfs_client_match_normalized | length > 0
          - nfs_client_match_normalized is match(ipv4_cidr_pattern)
        fail_msg: >-
          NFS client match must be an IPv4 subnet in CIDR form. Example:
          192.168.52.0/24. Leave it blank to skip the export policy rule.

    - name: Validate that nfs is selected for the SVM
      ansible.builtin.assert:
        that:
          - "'nfs' in protocol_list"
        fail_msg: >-
          The export policy rule uses protocol nfs. Select nfs for the SVM
          before setting the NFS client match. Selected protocols:
          {{ protocol_list | join(', ') if protocol_list | length > 0 else 'none' }}.

    - name: Show the NFS export policy rule
      ansible.builtin.debug:
        msg: >-
          SVM {{ svm_name_normalized }} default export policy, rule index 1,
          client match {{ nfs_client_match_normalized }}, protocol nfs,
          ro sys, rw sys, superuser sys, suid allowed. The SVM root volume
          is then assigned export policy default.

    - name: Create a new rule for the SVM NFS subnet in the default export policy
      netapp.ontap.na_ontap_export_policy_rule:
        state: present
        vserver: "{{ svm_name_normalized }}"
        policy_name: default
        client_match:
          - "{{ nfs_client_match_normalized }}"
        protocol:
          - nfs
        ro_rule:
          - sys
        rw_rule:
          - sys
        rule_index: 1
        super_user_security:
          - sys
        allow_suid: true
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always

    - name: Get the SVM root volume information
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - storage/volumes
        parameters:
          name: "*root"
          svm.name: "{{ svm_name_normalized }}"
        fields:
          - name
          - is_svm_root
      register: svm_rootvol
      no_log: true

    - name: Select the SVM root volume
      ansible.builtin.set_fact:
        root_volume_name: "{{ (chosen_root_records | first | default({})).name | default('') }}"
      vars:
        volume_records: >-
          {{
            (svm_rootvol.ontap_info.storage_volumes | default({})).records
            | default([])
          }}
        flagged_root_records: >-
          {{
            volume_records
            | selectattr('is_svm_root', 'defined')
            | selectattr('is_svm_root')
            | list
          }}
        root_name_candidates:
          - "{{ (svm_name_normalized | replace('-', '_')) ~ '_root' }}"
          - "{{ svm_name_normalized ~ '_root' }}"
        named_root_records: >-
          {{
            volume_records
            | selectattr('name', 'in', root_name_candidates)
            | list
          }}
        chosen_root_records: "{{ flagged_root_records if flagged_root_records | length > 0 else named_root_records }}"

    - name: Validate that the SVM root volume was found
      ansible.builtin.assert:
        that:
          - root_volume_name | default('') | length > 0
        fail_msg: >-
          Expected the SVM root volume on {{ svm_name_normalized }} before
          assigning export policy default. For SVM AA02-OCP-SVM that volume
          is AA02_OCP_SVM_root.

    - name: Show the SVM root volume export policy
      ansible.builtin.debug:
        msg: >-
          SVM {{ svm_name_normalized }} root volume {{ root_volume_name }}
          will use export policy default.

    # na_ontap_volume policy is volume modify -policy. The volume already
    # exists, so this only changes the export policy, and only when it is
    # not already default.
    - name: Assign the default export policy to the SVM root volume
      netapp.ontap.na_ontap_volume:
        state: present
        vserver: "{{ svm_name_normalized }}"
        name: "{{ root_volume_name }}"
        policy: default
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
