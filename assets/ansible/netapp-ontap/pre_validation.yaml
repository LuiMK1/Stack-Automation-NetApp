---
- name: Pre-Validation Tasks
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Get cluster information using REST CLI
      netapp.ontap.na_ontap_rest_cli:
        hostname: "{{ netapp_hostname }}"
        username: "{{ netapp_username }}"
        password: "{{ netapp_password }}"
        command: cluster
        verb: GET
      register: cluster_output

    - name: Print the full cluster show raw JSON response
      ansible.builtin.debug:
        var: cluster_output.output

    - name: Verify that all individual nodes in the cluster are healthy
      ansible.builtin.assert:
        that:
          - item.health == true or item.health == 'true'
          - item.eligibility == true or item.eligibility == 'true'
        fail_msg: "Node {{ item.node }} is unhealthy or ineligible! Current status - Health: {{ item.health }}, Eligibility: {{ item.eligibility }}"
        success_msg: "Node {{ item.node }} is healthy and eligible."
      loop: "{{ cluster_output.output.num_records | default(0) > 0 | ternary(cluster_output.output.records, []) }}"
      loop_control:
        label: "{{ item.node }}"
