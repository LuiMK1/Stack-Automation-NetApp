---
- name: Post Config Validation Tasks
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Get System Health status
      netapp.ontap.na_ontap_rest_cli:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        command: system/health/status
        verb: GET
        validate_certs: false
      register: health_status

    - name: Print the health status
      ansible.builtin.debug:
        var: health_status

    - name: Verify system health status is ok
      ansible.builtin.assert:
        that:
          - health_status.msg.status == 'ok'
        fail_msg: "System health status is not ok! Current status: {{ health_status.msg.status }}"
        success_msg: "System health status is ok."

    - name: Get System health alert
      netapp.ontap.na_ontap_rest_cli:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        command: system/health/alert
        verb: GET
        validate_certs: false
      register: health_alert

    - name: Verify there are no health alerts
      ansible.builtin.assert:
        that:
          - health_alert.msg.num_records == 0
        fail_msg: >
          Health alerts found! Count: {{ health_alert.msg.num_records }}.
          Records: {{ health_alert.msg.records | to_nice_json }}
        success_msg: "No health alerts found."

    - name: Send a test to AutoSupport
      netapp.ontap.na_ontap_autosupport_invoke:
        autosupport_message: "Ansible Verification Test"
        type: all
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false

    - name: Get AutoSupport message status
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        gather_subset:
          - support/autosupport/messages
        query:
          order_by: "index desc"
          max_records: 1
      register: latest_asup

    - name: Fail playbook if the AutoSupport transmission failed
      ansible.builtin.fail:
          msg: "AutoSupport failed with error: {{ latest_asup.ontap_info['support/autosupport/messages'].records[0].error.message | default('Unknown error') }}"
      when: latest_asup.ontap_info['support/autosupport/messages'].records[0].status in ['transmission_failed', 'collection_failed']

    - name: Confirm Success
      ansible.builtin.debug:
        msg: "AutoSupport successfully passed with status: {{ latest_asup.ontap_info['support/autosupport/messages'].records[0].status }}"
      when: latest_asup.ontap_info['support/autosupport/messages'].records[0].status == 'sent_successful'

    - name: Get the event logs
      netapp.ontap.na_ontap_rest_cli:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        command: event/log
        verb: GET
        params:
          severity: "emergency,alert,error"
        validate_certs: false
      register: event_log
  
    - name: Verify there are no error/emergency/alert severity events
      ansible.builtin.assert:
        that:
          - event_log.msg.num_records == 0
        fail_msg: >
          Events of severity error/emergency/alert are present! 
          Count: {{ event_log.msg.num_records }}. 
          Details: {{ event_log }}
        success_msg: "No error/emergency/alert severity events found."  
