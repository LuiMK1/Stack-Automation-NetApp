---
- name: Post Config Validation Tasks
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Get System Health status
      netapp.ontap.na_ontap_rest_cli:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        command: system/health/status
        verb: GET
        validate_certs: false
      register: health_status

    - name: Print the health status
      ansible.builtin.debug:
        var: health_status

    - name: Verify system health status is ok
      ansible.builtin.assert:
        that:
          - health_status.msg.status == 'ok'
        fail_msg: "System health status is not ok! Current status: {{ health_status.msg.status }}"
        success_msg: "System health status is ok."

    - name: Get System health alert
      netapp.ontap.na_ontap_rest_cli:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        command: system/health/alert
        verb: GET
        validate_certs: false
      register: health_alert

    - name: Print health alert records if any exist
      ansible.builtin.debug:
        var: health_alert.msg.records
      when: health_alert.msg.num_records != 0

    - name: Verify there are no health alerts
      ansible.builtin.assert:
        that:
          - health_alert.msg.num_records == 0
        fail_msg: "Health alerts found! Count: {{ health_alert.msg.num_records }}"
        success_msg: "No health alerts found."

    - name: Get the event logs
      netapp.ontap.na_ontap_rest_cli:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        command: event/log
        verb: GET
        validate_certs: false
      register: event_log
  
    - name: Print Event logs
      ansible.builtin.debug:
        var: event_log